<!-- LinkedIn-style vertical timeline, driven by _data/journey.yml -->
{% if site.data.journey.size > 0 %}
  <div id="journey">
    <h2 class="journey-heading">My journey so far...</h2>

    <div class="journey-timeline">
      {% for entry in site.data.journey %}
        <div class="journey-item">
          <div class="journey-dot">
            <i class="{{ entry.icon | default: 'fas fa-circle' }}"></i>
          </div>
          <div class="journey-card">
            <div class="journey-period">{{ entry.period }}</div>
            <h3 class="journey-org">{{ entry.org }}</h3>
            {% if entry.org %}
              <div class="journey-title">{{ entry.title }}</div>
            {% endif %}
            {% if entry.description %}
              <p class="journey-desc">{{ entry.description }}</p>
            {% endif %}
          </div>
        </div>
      {% endfor %}
    </div>
  </div>
{% endif %}
