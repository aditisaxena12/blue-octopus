#   icon:   optional Font Awesome class (defaults to a dot)

- title: Research Scholar 
  org: Indian Institute of Science (IISc) Bangalore
  period: 2024 - Present
  description: >-
    I traded deadlines for research questions and started my PhD at the
    meeting point of neuroscience and AI. These days I'm figuring out how to
    decode neural signals with deep reinforcement learning, without needing a
    high-end GPU to do it, so that Brain-Computer Interfaces can one day be
    lighter and more accessible. Still learning something new every week.
  icon: fas fa-flask

- title: Software Development Engineer 
  org: Microsoft Corporation, Hyderabad
  period: 2022-2024
  description: >-
    My first real job, with the Surface devices team. I worked on web and
    desktop apps and cloud services, and picked up a lot along the way: how
    to work in a team, how to ship things people actually use, and that
    asking questions early saves everyone time.
  icon: fas fa-chart-line

- title: Bachelor of Technology (B.Tech) in Computer Science & Engineering
  org: Indian Institute of Technology (IIT) Goa
  period: 2018-2022
  description: >-
    Four years by the Goa coast that gave me my closest friends, a lot of
    late-night coding, and my first real taste of computer science beyond
    the textbook. I still miss the place. (CGPA 9.33/10)
  icon: fas fa-graduation-cap

- title: Where it all started
